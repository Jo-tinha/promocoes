<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <title>Loja · Buba Promo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5c35'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topo" id="topo"></header>

    <main>
      <section class="cabeca-loja" id="cabeca-loja">
        <div class="container cabeca-loja-conteudo">
          <a class="voltar" href="/">← Vitrine</a>
          <div class="cabeca-loja-titulo">
            <img id="logo-loja" alt="" hidden />
            <div>
              <h1 id="nome-loja">Carregando…</h1>
              <p class="secao-nota" id="nota-loja"></p>
            </div>
          </div>
        </div>
      </section>

      <div class="container">
        <div class="filtros barra-loja">
          <input type="search" id="busca-loja" placeholder="Buscar nesta loja" aria-label="Buscar nesta loja" />
          <select id="ordem-loja" aria-label="Ordenar">
            <option value="Deal Rating">Melhor custo-benefício</option>
            <option value="Savings">Maior desconto</option>
            <option value="Price">Menor preço</option>
            <option value="Recent">Mais recentes</option>
            <option value="Reviews">Mais bem avaliados</option>
          </select>
        </div>
        <div class="grade-jogos" id="grade-loja"></div>
        <div class="mais-lojas"><button class="botao secundario" type="button" id="carregar-mais" hidden>Carregar mais promoções</button></div>
      </div>
    </main>

    <footer id="rodape"></footer>

    <script type="module" src="/src/loja.js"></script>
  </body>
</html>
