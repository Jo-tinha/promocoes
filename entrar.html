<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <title>Entrar · Buba Promo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5c35'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topo" id="topo"></header>

    <main class="container">
      <div class="caixa login">
        <div class="alternar-modo" role="group" aria-label="Entrar ou criar conta">
          <button type="button" data-modo="entrar" aria-pressed="true">Entrar</button>
          <button type="button" data-modo="criar" aria-pressed="false">Criar conta</button>
        </div>

        <form class="form" id="form-conta">
          <label id="campo-nome" hidden>Nome
            <input name="nome" autocomplete="name" maxlength="40" />
          </label>
          <label>E-mail
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>Senha
            <input type="password" name="senha" autocomplete="current-password" minlength="6" required />
          </label>
          <p class="mensagem" id="msg" role="alert"></p>
          <button class="botao" type="submit" id="enviar">Entrar</button>
          <button class="botao secundario" type="button" id="google">Entrar com Google</button>
          <button class="botao secundario pequeno" type="button" id="esqueci">Esqueci minha senha</button>
        </form>
      </div>
    </main>

    <footer id="rodape"></footer>

    <script type="module" src="/src/entrar.js"></script>
  </body>
</html>
