<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="robots" content="noindex" />
    <title>Painel · Buba Promo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5c35'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topo" id="topo"></header>

    <!-- Sem acesso -->
    <main class="container" id="sem-acesso" hidden>
      <div class="caixa login">
        <h2>Painel do administrador</h2>
        <div id="sem-acesso-texto" class="secao-nota"></div>
      </div>
    </main>

    <div id="painel" hidden>
      <nav class="abas container" role="tablist" aria-label="Seções do painel">
        <button class="aba" role="tab" data-aba="averiguar" aria-selected="true">Averiguar promoções</button>
        <button class="aba" role="tab" data-aba="vitrine" aria-selected="false">Destaques <span class="contador" id="qtd-vitrine" hidden></span></button>
        <button class="aba" role="tab" data-aba="recomendacoes" aria-selected="false">Recomendações diárias</button>
      </nav>

      <!-- Averiguar: promoções que chegam da CheapShark -->
      <main class="container painel-unico" id="aba-averiguar" role="tabpanel">
        <section class="caixa">
          <div class="secao-cabeca">
            <div>
              <h2 style="margin:0">Promoções chegando</h2>
              <p class="secao-nota" id="nota-averiguar">Promoções atuais da CheapShark. Todas já entram na vitrine; destaque as melhores.</p>
            </div>
          </div>
          <form class="filtros" id="filtros-averiguar">
            <input type="search" name="termo" placeholder="Buscar por título (opcional)" aria-label="Buscar por título" />
            <select name="loja" id="averiguar-loja" aria-label="Loja"><option value="">Todas as lojas</option></select>
            <select name="ordem" aria-label="Ordem">
              <option value="Recent">Chegaram por último</option>
              <option value="Savings">Maior desconto</option>
              <option value="Deal Rating">Melhor custo-benefício</option>
            </select>
            <label class="secao-nota" style="display:flex;align-items:center;gap:6px">
              <input type="checkbox" name="soNovas" style="width:auto" /> Esconder as que já são destaque
            </label>
            <button class="botao secundario" type="submit">Buscar</button>
          </form>
          <div class="lista-linhas" id="lista-averiguar"></div>
        </section>
      </main>

      <!-- Promoções aprovadas -->
      <main class="container painel-unico" id="aba-vitrine" role="tabpanel" hidden>
        <section class="caixa">
          <div class="secao-cabeca">
            <div>
              <h2 style="margin:0">Destaques escolhidos a dedo</h2>
              <p class="secao-nota" id="nota-vitrine"></p>
            </div>
            <button class="botao secundario pequeno" type="button" id="atualizar-todas">Atualizar todos os preços</button>
          </div>
          <div class="tabela-wrap">
            <table>
              <thead>
                <tr><th></th><th>Jogo</th><th>Preço</th><th>Destacado em</th><th>Situação</th><th>Ações</th></tr>
              </thead>
              <tbody id="lista-vitrine"></tbody>
            </table>
          </div>
        </section>
      </main>

      <!-- Recomendações diárias -->
      <main class="container painel" id="aba-recomendacoes" role="tabpanel" hidden>
        <section class="caixa">
          <h2 id="titulo-form-rec">Nova recomendação</h2>
          <form class="form" id="form-rec" novalidate>
            <div class="linha2">
              <label>Tipo
                <select name="tipo">
                  <option value="jogo">Jogo</option>
                  <option value="noticia">Notícia</option>
                  <option value="evento">Evento</option>
                </select>
              </label>
              <label>Dia
                <input name="data" type="date" required />
              </label>
            </div>
            <label>Título
              <input name="titulo" maxlength="90" required />
            </label>
            <label>Descrição
              <textarea name="descricao" maxlength="280" placeholder="Por que vale a pena?"></textarea>
            </label>
            <label>Link
              <input name="link" type="url" placeholder="https://… (loja, notícia, página do evento)" required />
            </label>
            <label>Imagem <span class="secao-nota">— link opcional</span>
              <input name="imagem" type="url" placeholder="https://…" />
            </label>
            <p class="mensagem" id="msg-rec" role="status"></p>
            <div class="form-acoes">
              <button class="botao" type="submit" id="salvar-rec">Publicar recomendação</button>
              <button class="botao secundario" type="button" id="cancelar-rec" hidden>Cancelar edição</button>
            </div>
          </form>
        </section>

        <section class="caixa">
          <div class="secao-cabeca">
            <h2 style="margin:0">Catálogo de recomendações</h2>
            <p class="secao-nota" id="nota-recs"></p>
          </div>
          <div class="tabela-wrap">
            <table>
              <thead>
                <tr><th>Dia</th><th>Tipo</th><th>Título</th><th>Ações</th></tr>
              </thead>
              <tbody id="lista-recs"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
