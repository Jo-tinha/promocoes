<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="robots" content="noindex" />
    <title>Busca · Buba Promo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5c35'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topo" id="topo"></header>

    <main class="container pagina-busca">
      <div class="busca-cabeca">
        <h1 id="titulo-busca">Buscar jogos</h1>
        <p class="secao-nota" id="resumo-busca">Digite o nome de um jogo na barra de busca lá em cima.</p>
      </div>

      <form class="filtros-busca" id="filtros-busca" hidden>
        <label>Loja
          <select name="loja"><option value="">Todas</option></select>
        </label>
        <label>Preço até (R$)
          <input name="max" type="number" min="1" step="1" inputmode="numeric" placeholder="qualquer" />
        </label>
        <label>Desconto
          <select name="desc">
            <option value="">Qualquer</option>
            <option value="25">25% ou mais</option>
            <option value="50">50% ou mais</option>
            <option value="75">75% ou mais</option>
            <option value="90">90% ou mais</option>
          </select>
        </label>
        <label>Ordenar
          <select name="ordem">
            <option value="Deal Rating">Relevância</option>
            <option value="Price">Menor preço</option>
            <option value="Savings">Maior desconto</option>
            <option value="Reviews">Mais bem avaliados</option>
            <option value="Recent">Mais recentes</option>
            <option value="Title">A–Z</option>
          </select>
        </label>
        <label class="check-filtro"><input type="checkbox" name="gratis" /> Só grátis</label>
        <button class="botao secundario pequeno" type="button" id="limpar-filtros" hidden>Limpar filtros</button>
      </form>

      <div class="grade-jogos" id="resultados"></div>
      <div class="mais-lojas"><button class="botao secundario" type="button" id="carregar-mais" hidden>Carregar mais</button></div>

      <section class="faixa" id="sec-outros" hidden aria-labelledby="titulo-outros">
        <div class="faixa-cabeca">
          <h2 id="titulo-outros">Sem promoção agora</h2>
          <p>Jogos com esse nome que não estão em oferta — estrele para ser avisado</p>
        </div>
        <div class="lista-outros" id="lista-outros"></div>
      </section>
    </main>

    <footer id="rodape"></footer>

    <script type="module" src="/src/busca.js"></script>
  </body>
</html>
